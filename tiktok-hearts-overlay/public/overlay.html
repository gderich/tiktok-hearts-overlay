<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Overlay de Corações — TikTok Live</title>
<style>
  :root {
    --cyan: #25F4EE;
    --pink: #FE2C55;
    --dark: #0e0e12;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--dark);
    font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body.transparent { background: transparent; }

  .wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px;
    width: 340px;
  }

  /* ---------- Contador total de corações ---------- */
  .counter {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(254,44,85,0.92), rgba(37,244,238,0.85));
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .counter .heart-icon {
    font-size: 34px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    transform-origin: center;
  }
  .counter .heart-icon.pop {
    animation: pop 380ms ease-out;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.5) rotate(-8deg); }
    100% { transform: scale(1); }
  }
  .counter .numbers { line-height: 1.1; }
  .counter .total {
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    font-variant-numeric: tabular-nums;
  }
  .counter .label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
  }
  .status-dot {
    margin-left: auto;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ff5757;
    box-shadow: 0 0 6px #ff5757;
  }
  .status-dot.live {
    background: #37ff8b;
    box-shadow: 0 0 8px #37ff8b;
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ---------- Ranking ---------- */
  .board {
    background: rgba(14,14,18,0.82);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px 12px 6px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .board h2 {
    margin: 2px 6px 10px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cyan);
    font-weight: 700;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.04);
    transition: transform 320ms ease, background 320ms ease;
  }
  .row.rank-1 { background: linear-gradient(90deg, rgba(255,215,0,0.22), rgba(255,255,255,0.04)); }
  .row.rank-2 { background: linear-gradient(90deg, rgba(192,192,192,0.20), rgba(255,255,255,0.04)); }
  .row.rank-3 { background: linear-gradient(90deg, rgba(205,127,50,0.20), rgba(255,255,255,0.04)); }

  .rank-num {
    width: 22px;
    text-align: center;
    font-weight: 800;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
  }
  .rank-1 .rank-num::before { content: '🥇'; font-size: 16px; }
  .rank-2 .rank-num::before { content: '🥈'; font-size: 16px; }
  .rank-3 .rank-num::before { content: '🥉'; font-size: 16px; }
  .rank-1 .rank-num, .rank-2 .rank-num, .rank-3 .rank-num { font-size: 0; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .name {
    flex: 1;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hearts {
    font-size: 13px;
    font-weight: 700;
    color: var(--pink);
    display: flex;
    align-items: center;
    gap: 3px;
    font-variant-numeric: tabular-nums;
  }
  .empty {
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    padding: 10px 8px 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="counter">
      <div class="heart-icon" id="heartIcon">❤️</div>
      <div class="numbers">
        <div class="total" id="totalHearts">0</div>
        <div class="label">corações na live</div>
      </div>
      <div class="status-dot" id="statusDot" title="status da conexão"></div>
    </div>

    <div class="board">
      <h2>🏆 Ranking de corações</h2>
      <div id="rankingList">
        <div class="empty">Aguardando corações...</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('transparent') === '1') {
      document.body.classList.add('transparent');
    }
    const maxRows = parseInt(params.get('rows') || '10', 10);

    const socket = io();
    if (params.get('reset') === '1') {
      socket.on('connect', () => socket.emit('reset'));
    }
    const totalEl = document.getElementById('totalHearts');
    const heartIcon = document.getElementById('heartIcon');
    const statusDot = document.getElementById('statusDot');
    const rankingList = document.getElementById('rankingList');

    let lastTotal = 0;

    function initials(name) {
      return (name || '?').trim().slice(0, 2).toUpperCase();
    }

    function render(data) {
      // contador total, com animação quando aumenta
      const newTotal = data.totalHearts || 0;
      if (newTotal !== lastTotal) {
        totalEl.textContent = newTotal.toLocaleString('pt-BR');
        heartIcon.classList.remove('pop');
        void heartIcon.offsetWidth; // reinicia a animação
        heartIcon.classList.add('pop');
        lastTotal = newTotal;
      }

      statusDot.classList.toggle('live', !!data.connected);
      statusDot.title = data.connected
        ? `Conectado em @${data.username}`
        : 'Desconectado — tentando reconectar';

      // ranking
      const ranking = (data.ranking || []).slice(0, maxRows);
      if (ranking.length === 0) {
        rankingList.innerHTML = '<div class="empty">Aguardando corações...</div>';
        return;
      }
      rankingList.innerHTML = ranking.map((u, i) => {
        const rank = i + 1;
        const avatar = u.profilePicture
          ? `<img src="${u.profilePicture}" alt="" onerror="this.parentNode.textContent='${initials(u.nickname)}'"/>`
          : initials(u.nickname);
        return `
          <div class="row rank-${rank}">
            <div class="rank-num">${rank}</div>
            <div class="avatar">${avatar}</div>
            <div class="name">${u.nickname || u.uniqueId}</div>
            <div class="hearts">❤️ ${u.hearts.toLocaleString('pt-BR')}</div>
          </div>
        `;
      }).join('');
    }

    socket.on('state', render);
  </script>
</body>
</html>
